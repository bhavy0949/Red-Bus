services:
  postgres:
    image: postgres:15
    container_name: redbus-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  member-service:
    image: bhavy0949/redbus-member-service:latest
    container_name: redbus-member-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/memberDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
    depends_on:
      postgres:
        condition: service_healthy

  expedition-service:
    image: bhavy0949/redbus-expedition-service:latest
    container_name: redbus-expedition-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/expeditionDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    image: bhavy0949/redbus-payment-service:latest
    container_name: redbus-payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
    depends_on:
      postgres:
        condition: service_healthy

  security-service:
    image: bhavy0949/redbus-security-service:latest
    container_name: redbus-security-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/securityDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: bhavy0949/redbus-api-gateway:latest
    container_name: redbus-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      member-service:
        condition: service_started
      expedition-service:
        condition: service_started
      payment-service:
        condition: service_started
      security-service:
        condition: service_started

  frontend:
    image: bhavy0949/redbus-frontend:latest
    container_name: redbus-frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: redbus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
