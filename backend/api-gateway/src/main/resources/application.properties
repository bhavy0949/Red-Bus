#--- Application Name ---
spring.application.name=api-gateway
spring.output.ansi.enabled=always

#--- Activate Docker profile ---
spring.profiles.active=docker

# --- Server ---
server.port=8080

# --- JWT ---
jwt.secret=${JWT_SECRET:change-me-in-production-min-32-chars!!}

# --- Downstream service base URLs ---
# Overridden per environment from the redbus-config ConfigMap; the defaults
# match the in-cluster Kubernetes Service DNS names.
services.expedition.base-url=${EXPEDITION_SERVICE_URL:http://expedition-service:8082}
services.member.base-url=${MEMBER_SERVICE_URL:http://member-service:8081}
services.security.base-url=${SECURITY_SERVICE_URL:http://security-service:8084}
