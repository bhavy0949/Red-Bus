# Test config: shadows src/main/resources/application.properties on the test
# classpath. Deliberately does NOT activate the "docker" profile, so the fixed
# jdbc:postgresql://postgres:5432 datasource is not loaded — the Testcontainers
# PostgreSQL instance is wired in via @ServiceConnection instead.

spring.application.name=expedition-service-test

# Let Hibernate build the schema in the throwaway container.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true

# Keep the background block-expiry sweeper from firing during tests.
seat.block.sweeper.interval-ms=3600000
