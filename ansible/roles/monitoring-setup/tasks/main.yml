---
- name: Create Prometheus ConfigMap
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: prometheus-config
        namespace: "{{ k8s_namespace }}"
      data:
        prometheus.yml: |
          global:
            scrape_interval: 15s
          scrape_configs:
          - job_name: 'kubernetes-pods'
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - "{{ k8s_namespace }}"

- name: Deploy Prometheus
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('file', '/Users/bhavygupta/Downloads/Red-Bus-main/k8s/prometheus.yaml') | from_yaml_all | list }}"

- name: Deploy Grafana
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('file', '/Users/bhavygupta/Downloads/Red-Bus-main/k8s/grafana.yaml') | from_yaml_all | list }}"

- name: Wait for Prometheus to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ k8s_namespace }}"
    label_selectors:
      - app=prometheus
  register: prometheus_pods
  until: 
    - prometheus_pods.resources | length > 0
    - prometheus_pods.resources[0].status.phase == "Running"
  retries: 30
  delay: 10

- name: Wait for Grafana to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ k8s_namespace }}"
    label_selectors:
      - app=grafana
  register: grafana_pods
  until: 
    - grafana_pods.resources | length > 0
    - grafana_pods.resources[0].status.phase == "Running"
  retries: 30
  delay: 10

- name: Verify monitoring stack deployment
  command: "kubectl get pods -n {{ k8s_namespace }} -l app=prometheus,app=grafana"
  changed_when: false
  register: monitoring_status

- name: Display monitoring stack status
  debug:
    msg: "{{ monitoring_status.stdout }}"
